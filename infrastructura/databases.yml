AWSTemplateFormatVersion: '2010-09-09'
Description: TacticAI — RDS PostgreSQL and Redis on EC2

Parameters:
  Env:
    Type: String
    Default: production

  DBPassword:
    Type: String
    NoEcho: true

  RedisAuthToken:
    Type: String
    NoEcho: true

Resources:
  # ── Security Groups ───────────────────────────────────────────────
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL access
      VpcId:
        Fn::ImportValue: !Sub tacticai-${Env}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort:   5432
          ToPort:     5432
          CidrIp:     10.0.0.0/16

  # ── RDS Subnet Group ─────────────────────────────────────────────
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: TacticAI DB subnet group
      SubnetIds:
        - Fn::ImportValue: !Sub tacticai-${Env}-PrivateSubnetA
        - Fn::ImportValue: !Sub tacticai-${Env}-PrivateSubnetB

  # ── RDS PostgreSQL ───────────────────────────────────────────────
  PostgresDB:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub tacticai-${Env}-postgres
      DBName:               tacticai
      Engine:               postgres
      EngineVersion:        '15'
      DBInstanceClass:      db.t3.micro
      AllocatedStorage:     20
      MaxAllocatedStorage:  20
      StorageType:          gp2
      MasterUsername:       tacticai_user
      MasterUserPassword:   !Ref DBPassword
      MultiAZ:              false
      PubliclyAccessible:   false
      DBSubnetGroupName:    !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      BackupRetentionPeriod: 1
      DeletionProtection:    false
      StorageEncrypted:      false
      Tags:
        - Key: Env
          Value: !Ref Env

  # ── Security Group for Redis EC2 ─────────────────────────────────
  RedisEC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redis access from ECS tasks
      VpcId:
        Fn::ImportValue: !Sub tacticai-${Env}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort:   6379
          ToPort:     6379
          CidrIp:     10.0.0.0/16

  # ── IAM Role for Redis EC2 (SSM included for administration) ─────
  RedisEC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  RedisEC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref RedisEC2Role

  # ── Redis EC2 Instance ───────────────────────────────────────────
  # Public subnet for package/SSM endpoint access.
  # Redis port restricted to VPC CIDR only via security group.
  RedisEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2}}'
      InstanceType: t3.micro
      IamInstanceProfile: !Ref RedisEC2InstanceProfile
      SecurityGroupIds:
        - !Ref RedisEC2SecurityGroup
      SubnetId:
        Fn::ImportValue: !Sub tacticai-${Env}-PublicSubnetA
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -x
          exec > /var/log/user-data.log 2>&1

          # Redis 6 via amazon-linux-extras (yum default repos don't include redis)
          amazon-linux-extras install redis6 -y
          sed -i 's/^bind 127.0.0.1.*$/bind 0.0.0.0/' /etc/redis/redis.conf
          sed -i 's/^# requirepass foobared/requirepass ${RedisAuthToken}/' /etc/redis/redis.conf
          systemctl enable redis
          systemctl start redis

          # PostgreSQL 14 client for DB initialisation via SSM Session Manager
          amazon-linux-extras install postgresql14 -y
          yum install -y postgresql
      Tags:
        - Key: Name
          Value: !Sub tacticai-${Env}-redis-ec2

Outputs:
  DBEndpoint:
    Value: !GetAtt PostgresDB.Endpoint.Address
    Export:
      Name: !Sub tacticai-${Env}-DBEndpoint

  RedisEndpoint:
    Value: !GetAtt RedisEC2Instance.PrivateIp
    Export:
      Name: !Sub tacticai-${Env}-RedisEndpoint

  RedisInstanceId:
    Value: !Ref RedisEC2Instance
    Export:
      Name: !Sub tacticai-${Env}-RedisInstanceId
