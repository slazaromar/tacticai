AWSTemplateFormatVersion: '2010-09-09'
Description: TacticAI - ECS Cluster (Fargate), ECR repos y servicios

Parameters:
  Env:
    Type: String
    Default: production

  ImageTag:
    Type: String
    Default: latest

  DBPassword:
    Type: String
    NoEcho: true

  JWTSecret:
    Type: String
    NoEcho: true

  JWTRefreshSecret:
    Type: String
    NoEcho: true

  RecomendacionAPIKey:
    Type: String
    NoEcho: true

  RedisAuthToken:
    Type: String
    NoEcho: true

Resources:
  # ── ECS Cluster ───────────────────────────────────────────────────
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub tacticai-${Env}

  # ── IAM Roles ─────────────────────────────────────────────────────
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub tacticai-${Env}-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub tacticai-${Env}-ecs-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  # ── CloudWatch Log Groups ─────────────────────────────────────────
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/tacticai-${Env}/backend
      RetentionInDays: 30

  RecomendacionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/tacticai-${Env}/recomendacion
      RetentionInDays: 30

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/tacticai-${Env}/frontend
      RetentionInDays: 30

  # ── Security Groups ───────────────────────────────────────────────
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB inbound HTTP/HTTPS
      VpcId:
        Fn::ImportValue: !Sub tacticai-${Env}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort:   80
          ToPort:     80
          CidrIp:     0.0.0.0/0
        - IpProtocol: tcp
          FromPort:   443
          ToPort:     443
          CidrIp:     0.0.0.0/0

  # Security group for all Fargate tasks
  FargateSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Fargate tasks - inbound from ALB and within VPC
      VpcId:
        Fn::ImportValue: !Sub tacticai-${Env}-VpcId
      SecurityGroupIngress:
        # Traffic from ALB (frontend :80, backend :4000)
        - IpProtocol: tcp
          FromPort:   0
          ToPort:     65535
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        # Inter-service communication within VPC (e.g. backend -> recomendacion :8000)
        - IpProtocol: tcp
          FromPort:   0
          ToPort:     65535
          CidrIp:     10.0.0.0/16
      # All outbound allowed (ECR pulls, DB, Redis, external APIs)
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp:     0.0.0.0/0

  # ── Application Load Balancer ─────────────────────────────────────
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub tacticai-${Env}-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref ALBSecurityGroup]
      Subnets:
        - Fn::ImportValue: !Sub tacticai-${Env}-PublicSubnetA
        - Fn::ImportValue: !Sub tacticai-${Env}-PublicSubnetB

  # ip TargetType required for Fargate (awsvpc networking)
  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub tacticai-${Env}-frontend-tg
      Port:       80
      Protocol:   HTTP
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub tacticai-${Env}-VpcId
      HealthCheckPath:                /
      HealthCheckIntervalSeconds:     30
      HealthCheckTimeoutSeconds:      5
      HealthyThresholdCount:          2
      UnhealthyThresholdCount:        3

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub tacticai-${Env}-backend-tg
      Port:       4000
      Protocol:   HTTP
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub tacticai-${Env}-VpcId
      HealthCheckPath:                /health
      HealthCheckIntervalSeconds:     30
      HealthCheckTimeoutSeconds:      5
      HealthyThresholdCount:          2
      UnhealthyThresholdCount:        3

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port:     80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  ALBListenerRuleAPI:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority:    10
      Conditions:
        - Field: path-pattern
          Values: ['/api/*']
      Actions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  # ── Service Discovery (Cloud Map) ─────────────────────────────────
  ServiceDiscoveryNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: tacticai.local
      Vpc:
        Fn::ImportValue: !Sub tacticai-${Env}-VpcId

  # A records work with Fargate awsvpc: resolves to task's private IP
  BackendDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: backend
      NamespaceId: !Ref ServiceDiscoveryNamespace
      DnsConfig:
        DnsRecords:
          - Type: A
            TTL: 10
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1

  RecomendacionDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: recomendacion
      NamespaceId: !Ref ServiceDiscoveryNamespace
      DnsConfig:
        DnsRecords:
          - Type: A
            TTL: 10
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1

  # ── Backend Task Definition (Fargate / awsvpc) ────────────────────
  BackendTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family:                  !Sub tacticai-${Env}-backend
      NetworkMode:             awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu:                     '256'
      Memory:                  '512'
      ExecutionRoleArn:        !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn:             !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name:  backend
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/tacticai-backend:${ImageTag}
          PortMappings:
            - ContainerPort: 4000
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: '4000'
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub tacticai-${Env}-DBEndpoint
            - Name: DB_PORT
              Value: '5432'
            - Name: DB_NAME
              Value: tacticai
            - Name: DB_USER
              Value: tacticai_user
            - Name: DB_PASSWORD
              Value: !Ref DBPassword
            - Name: REDIS_HOST
              Value:
                Fn::ImportValue: !Sub tacticai-${Env}-RedisEndpoint
            - Name: REDIS_PORT
              Value: '6379'
            - Name: REDIS_PASSWORD
              Value: !Ref RedisAuthToken
            - Name: JWT_SECRET
              Value: !Ref JWTSecret
            - Name: JWT_EXPIRES_IN
              Value: 15m
            - Name: JWT_REFRESH_SECRET
              Value: !Ref JWTRefreshSecret
            - Name: JWT_REFRESH_EXPIRES_IN
              Value: 7d
            - Name: MOTOR_RECOMENDACION_URL
              Value: http://recomendacion.tacticai.local:8000
            - Name: MOTOR_RECOMENDACION_API_KEY
              Value: !Ref RecomendacionAPIKey
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:  !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # ── Motor de Recomendación Task Definition (Fargate / awsvpc) ─────
  RecomendacionTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family:                  !Sub tacticai-${Env}-recomendacion
      NetworkMode:             awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu:                     '512'
      Memory:                  '1024'
      ExecutionRoleArn:        !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn:             !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name:  recomendacion
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/tacticai-recomendacion:${ImageTag}
          PortMappings:
            - ContainerPort: 8000
          Environment:
            - Name: INTERNAL_API_KEY
              Value: !Ref RecomendacionAPIKey
            - Name: DATABASE_URL
              Value: !Sub
                - postgresql://tacticai_user:${DBPassword}@${DBHost}:5432/tacticai
                - DBHost:
                    Fn::ImportValue: !Sub tacticai-${Env}-DBEndpoint
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:  !Ref RecomendacionLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # ── Frontend Task Definition (Fargate / awsvpc) ───────────────────
  FrontendTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family:                  !Sub tacticai-${Env}-frontend
      NetworkMode:             awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu:                     '256'
      Memory:                  '512'
      ExecutionRoleArn:        !GetAtt ECSTaskExecutionRole.Arn
      ContainerDefinitions:
        - Name:  frontend
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/tacticai-frontend:${ImageTag}
          PortMappings:
            - ContainerPort: 80
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:  !Ref FrontendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  # ── Backend Service ───────────────────────────────────────────────
  BackendService:
    Type: AWS::ECS::Service
    DependsOn: ALBListenerRuleAPI
    Properties:
      Cluster:        !Ref ECSCluster
      TaskDefinition: !Ref BackendTaskDef
      LaunchType:     FARGATE
      DesiredCount:   1
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - Fn::ImportValue: !Sub tacticai-${Env}-PublicSubnetA
            - Fn::ImportValue: !Sub tacticai-${Env}-PublicSubnetB
          SecurityGroups:
            - !Ref FargateSecurityGroup
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 4000
          TargetGroupArn: !Ref BackendTargetGroup
      ServiceRegistries:
        - RegistryArn: !GetAtt BackendDiscoveryService.Arn
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent:        200

  # ── Motor de Recomendación Service ───────────────────────────────
  RecomendacionService:
    Type: AWS::ECS::Service
    Properties:
      Cluster:        !Ref ECSCluster
      TaskDefinition: !Ref RecomendacionTaskDef
      LaunchType:     FARGATE
      DesiredCount:   1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - Fn::ImportValue: !Sub tacticai-${Env}-PublicSubnetA
            - Fn::ImportValue: !Sub tacticai-${Env}-PublicSubnetB
          SecurityGroups:
            - !Ref FargateSecurityGroup
      ServiceRegistries:
        - RegistryArn: !GetAtt RecomendacionDiscoveryService.Arn
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent:        200

  # ── Frontend Service ──────────────────────────────────────────────
  FrontendService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      Cluster:        !Ref ECSCluster
      TaskDefinition: !Ref FrontendTaskDef
      LaunchType:     FARGATE
      DesiredCount:   1
      HealthCheckGracePeriodSeconds: 30
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - Fn::ImportValue: !Sub tacticai-${Env}-PublicSubnetA
            - Fn::ImportValue: !Sub tacticai-${Env}-PublicSubnetB
          SecurityGroups:
            - !Ref FargateSecurityGroup
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 80
          TargetGroupArn: !Ref FrontendTargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent:        200

Outputs:
  ALBDNSName:
    Value: !GetAtt ALB.DNSName
    Export:
      Name: !Sub tacticai-${Env}-ALBDnsName

  ECSClusterName:
    Value: !Ref ECSCluster
    Export:
      Name: !Sub tacticai-${Env}-ECSCluster
